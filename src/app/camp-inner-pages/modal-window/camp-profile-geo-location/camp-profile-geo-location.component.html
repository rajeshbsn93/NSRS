<div class="modal-body experience-modal">
    <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.close(false)"></button>
    <div class="titleTxt d-flex flex-wrap justify-content-between align-items-center">
      <h3 class="d-inline-flex align-items-center"><span class="titleIcon"><i class="icon-map-pin-line-2"></i></span>Geo Location</h3>
      <!-- <button href="javascript:void(0)" (click)="addEdit(null)" class="btn btn-blue py-1 me-4">ADD</button> -->
    </div>
      <div class="athlete">
        <div class="table-responsive mt-3">
            <table mat-table class="currentTable" matTableExporter  #exporter="matTableExporter" [dataSource]="campGeolocationListData" matSort class="table-striped w-100">  
                                
                <!-- <ng-container matColumnDef="discipline">
                <th mat-header-cell *matHeaderCellDef mat-sort-header="discipline" class="text-nowrap"> Discipline</th>
                <td mat-cell *matCellDef="let row"> 
                    {{row.discipline}}  
                </td>
                </ng-container>  
                <ng-container matColumnDef="state">
                <th mat-header-cell *matHeaderCellDef mat-sort-header="state" class="text-nowrap"> State</th>
                <td mat-cell *matCellDef="let row"> 
                    {{row.state}}  
                </td>
                </ng-container>    -->
                <ng-container matColumnDef="gender">
                <th mat-header-cell *matHeaderCellDef mat-sort-header="gender" class="text-nowrap"> Gender</th>
                <td mat-cell *matCellDef="let row"> 
                    {{row.gender}}  
                </td>
                </ng-container> 

                <ng-container matColumnDef="location">
                <th mat-header-cell *matHeaderCellDef mat-sort-header="location_Name" class="col-2"> Location</th>
                <td mat-cell *matCellDef="let row"> 
                    {{row.location_Name}}  
                </td>
                </ng-container>  
                
                <ng-container matColumnDef="venue">
                <th mat-header-cell *matHeaderCellDef mat-sort-header="venuename"> 
                    Venue
                </th>
                <td mat-cell *matCellDef="let row"> 
                    {{row.venuename}}
                </td>
                </ng-container>
                
                <ng-container matColumnDef="radius">
                <th mat-header-cell *matHeaderCellDef mat-sort-header="radious"> 
                    Radius
                </th>
                <td mat-cell *matCellDef="let row"> 
                    {{row.radious}} {{row.radious < 2 ? 'Mtr' : 'Mtrs'}} 
                </td>
                </ng-container>
                <ng-container matColumnDef="time">
                <th mat-header-cell *matHeaderCellDef mat-sort-header="start_Time"> 
                    Time
                </th>
                <td mat-cell *matCellDef="let row" class="text-nowrap"> 
                  {{row.start_Time}} {{row.start_Time ? ' - ' : ''}} {{row.end_Time}}
                </td>
                </ng-container>
            
                <tr mat-header-row *matHeaderRowDef="experienceTableColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: experienceTableColumns;"></tr>      
            
                
                <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell text-center" colspan="13"> <span class="noDataFound"> No Data Found </span></td>
                </tr>
            </table>     
        </div>
        <mat-paginator [pageSizeOptions]="[5,10, 50, 100]" aria-label="Select page of users"></mat-paginator>
      </div>
    
  </div>

  <app-loader *ngIf="loader"></app-loader>
