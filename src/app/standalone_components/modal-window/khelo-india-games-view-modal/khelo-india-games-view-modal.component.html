    <div class="modal-body tagcommonModal language-modal">
        <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.close(false)"></button>
        <div class="titleTxt d-flex flex-wrap justify-content-between align-items-center">
        <h3><span class="titleIcon"><i class="icon-kicAttendanceHistory"></i></span>Khelo India Games</h3>
        <button type="button" class="btn btn-blue py-1 me-4" (click)="addEditKheloIndiaGames(null)"> ADD </button>
        </div>
        <hr />
        <div class="athlete">
            <div class="table-responsive">
                <table mat-table class="currentTable" matTableExporter  #exporter="matTableExporter" [dataSource]="KheloIndiaPlayerData" matSort class="table-striped w-100">  
                                        
                    <ng-container matColumnDef="gameName">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header="gamename" class="col-4"> Khelo India Games</th>
                    <td mat-cell *matCellDef="let row"> {{row.gamename}} </td>
                    </ng-container>
                    <ng-container matColumnDef="st_Uni_name">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header="stuniname" class="col-5">Participating State/University</th>
                    <td mat-cell *matCellDef="let row"> {{row.stuniname}} </td>
                    </ng-container>
                    <ng-container matColumnDef="status">
                    <th mat-header-cell *matHeaderCellDef>Status</th>
                    <td mat-cell *matCellDef="let row"> 
                      <button class="btn pe-none text-nowrap text-uppercase" [ngClass]="row.isVerified ? 'btn-success btn-status' : ' btn-danger status-not-verified'"> {{row.isVerified ? 'Verified' : 'Not Verified'}}</button>
                    </td>
                    </ng-container>
                    <ng-container matColumnDef="action">
                    <th mat-header-cell *matHeaderCellDef>Action</th>
                    <td mat-cell *matCellDef="let row" class="action_col col-auto">
                        <ng-container *ngIf="!row.isVerified">
                          <a class="action_icon" href="javascript:void(0)" (click)="addEditKheloIndiaGames(row)">
                            <mat-icon class="material-symbols-outlined" fontIcon="border_color"></mat-icon>
                          </a>
                          <a href="javascript:void(0)" (click)="deleteGame(row)" class="ms-1 me-1 action_icon fa_trash">
                              <i class="fa-solid fa-trash-can"></i>
                          </a>
                        </ng-container>
                        <ng-container *ngIf="row.isVerified">
                          <span class="action_icon"  (click)="downloadImage(row)"  placement="bottom" tooltipClass="custom-tooltip" ngbTooltip="Download game photos">
                            <i class="icon-download_image_zip"></i>
                          </span> 
                          <span (click)="certificates(row)" tooltipClass="custom-tooltip"  placement="bottom"  ngbTooltip="View certificates" class="p-0 m-0 border-0 bg-transparent action_icon">
                            <i class="icon-download_certificate"></i>
                          </span>
                        </ng-container>                    
                    </td>
                    </ng-container>
                    <tr mat-header-row *matHeaderRowDef="kheloIndiaPlayerTableColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: kheloIndiaPlayerTableColumns;"></tr> 
                    <tr class="mat-row" *matNoDataRow>
                    <td class="mat-cell text-center" colspan="13"> <span class="noDataFound"> No Data Found </span></td>
                    </tr>
                </table>
            </div>
            <mat-paginator [pageSizeOptions]="[5,10, 50, 100]" aria-label="Select page of users"></mat-paginator>
        </div>
    </div>
    <ng-template #deleteModalRef let-modal>
        <div class="modal-body tagcommonModal deleteCommonModal deleteCoachSS">
          <button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss('Cross click')"></button>
          <div class="titleTxt">
            <!-- <h4 class="text-center fw-bold">{{deleteRowData?.tournament_name }} <span *ngIf="deleteRowData.category !==null">({{deleteRowData.category}})</span></h4> -->
            <h4 class="text-center fw-bold">{{deleteGameRow.gamename}} <!--<span *ngIf="deleteRowData.category !==null">({{deleteRowData.category}})</span>--></h4>
          </div>
          <div class="text-center mt-3 pt-lg-2">
            <p>Please confirm if you want delete this game!</p>
          </div>
          <div class="text-center pb-3">
            <button type="button" class="btn btn-lightblue me-2 px-3 me-sm-3 me-lg-4"
              (click)="modal.close('Save click')">CANCEL</button>
            <button type="button" class="btn btn-lightblue px-3" (click)="confirmDelete()">CONFIRM</button>
          </div>
        </div>
    </ng-template>

  <app-loader *ngIf="loader"></app-loader>
