
<div class="container">
<div class="row align-items-center justify-content-end mb-2">
  <div class="col-auto ">
    <button type="button" class="btn-close" aria-label="Close" (click)="close()" ></button>
  </div>
</div>
  <div class="modal-body tagcommonModal deleteCommonModal deleteCoachSS">
  
    <div class="titleTxt">
      <h4 class="text-center fw-bold my-spl-text">{{data?.tournamentName}} <!--<span *ngIf="deleteRowData.category !==null">({{deleteRowData.category}})</span>--></h4>
    </div>
    <div class="text-center mt-3 pt-lg-2">
      <p>{{message}}</p>
    </div>
    <div class="text-center pb-3">
      <button type="button" (click)="onConfirmClick(1)" class="btn btn-lightblue me-2 px-3 me-sm-3 me-lg-4"
       >{{confirmButtonText}}</button>
      <button type="button" (click)="onConfirmClick(2)" class="btn btn-lightblue px-3" >{{cancelButtonText}}</button>
    </div>
  </div>
</div>
