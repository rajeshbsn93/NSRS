<div class="modal-body tagcommonModal language-modal">
    <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.close(false)"></button>
    <div class="titleTxt d-flex flex-wrap justify-content-between align-items-center">
    <h3><span class="titleIcon"><i class="icon-download_certificate"></i></span> Certificate Details</h3>
    <!-- <button type="button" class="btn btn-blue py-1 me-4" (click)="addEditKheloIndiaGames(null)"> ADD </button> -->
    </div>
    <hr />
    <div class="athlete">
        <div class="table-responsive">
            <table mat-table class="currentTable" matTableExporter  #exporter="matTableExporter" [dataSource]="KheloIndiaPlayerData" matSort class="table-striped w-100">  
                                    
                <ng-container matColumnDef="certificate_Type">
                <th mat-header-cell *matHeaderCellDef mat-sort-header="certificate_Type">Certificate Type</th>
                <td mat-cell *matCellDef="let row"> {{row.certificate_Type}} </td>
                </ng-container>
                <ng-container matColumnDef="certificate_number">
                <th mat-header-cell *matHeaderCellDef mat-sort-header="certificate_number">Certificate No.</th>
                <td mat-cell *matCellDef="let row"> {{row.certificate_number}} </td>
                </ng-container>
                <ng-container matColumnDef="position">
                <th mat-header-cell *matHeaderCellDef mat-sort-header="position">position</th>
                <td mat-cell *matCellDef="let row"> {{row.position}} </td>
                </ng-container>
                <ng-container matColumnDef="event_name">
                <th mat-header-cell *matHeaderCellDef mat-sort-header="event_name">Event Name</th>
                <td mat-cell *matCellDef="let row"> {{row.event_name}} </td>
                </ng-container>
                <tr mat-header-row *matHeaderRowDef="kheloIndiaPlayerTableColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: kheloIndiaPlayerTableColumns;"></tr> 
                <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell text-center" colspan="13"> <span class="noDataFound"> No Data Found </span></td>
                </tr>
            </table>
        </div>
        <mat-paginator [pageSizeOptions]="[5,10, 50, 100]" aria-label="Select page of users"></mat-paginator>
    </div>
</div>
