<div class="modal-body education-modal-wrapper education-modal">
    <button
      type="button"
      class="btn-close"
      aria-label="Close"
      (click)="activeModal.close(false)"
    ></button>
    <div class="titleTxt d-flex flex-wrap justify-content-between align-items-center">
      <h3>
        <span class="titleIcon"><img src="assets/images/aadhaar.svg" class="icon-language"></span>Verify Aadhaar
      </h3>
    </div>
    <div class="text-center">
      <p>Please complete your Aadhaar verification to continue.</p>
      <div>
        <button (click)="activeModal.close(false)" class="btn btn-light bg-white border py-2 px-3 px-md-4 me-2">Cancel</button>
        <button class="btn btn-blue py-2 px-3" (click)="verifyAadhar()">Verify Aadhaar</button>
      </div>
    </div>
  </div>
