

<div class="athleteAction-modal">
    <div class="modal-body">
      <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss('Cross click')"></button>
      <nav>
        <div class="nav nav-tabs" id="nav-tab" role="tablist">
          <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#athletetag" type="button"><span class="titleIcon"><i class="icon-personal-information-18"></i></span>TRAINING DETAILS</button>
        </div>
      </nav>
  
  
      <div class="tab-content" id="nav-tabContent">
        <div class="tab-pane fade show active" id="athletetag">
          <div class="d-flex justify-content-between align-items-center my-2">
            <h5></h5>
            <!-- <button class="btn border px-3 text-uppercase addmore" *ngIf="equipmentModalData.action == 'add'" (click)="newAddMultiTagArray()">ADD MORE +</button> -->
          </div>
          <form [formGroup]="multiTrainingDetailsForm">
            <div class="table-responsive mt-3">
              <table class="table ">
                <tbody formArrayName="addMultiTagArray">
                
                  <tr  *ngFor="let item of addMultiTagArray.controls; let i= index" [formGroupName]="i">
                 
                    <!-- <td>{{i + 1}}</td> -->
                    <!-- <td>
                      <mat-form-field class="example-full-width w-100" appearance="fill">
                        <mat-label>ACADEMY KIUD</mat-label> 
                        <input matInput   formControlName="academy_kuid">
                       
                      </mat-form-field>
                    </td> -->
                   <td *ngIf="KicUsersRoleId.kisceAdmin != this.userDetails.role_id">
                    <mat-form-field class="example-full-width w-100" appearance="fill">
                      <mat-label>KIC NAME</mat-label> 
                      <input matInput [value]="this.equipmentModalData.data.kiC_NAME" [disabled]="true">
                     
                    </mat-form-field>
                   </td>
                   <td *ngIf="KicUsersRoleId.kisceAdmin != this.userDetails.role_id">
                    <mat-form-field class="example-full-width w-100" appearance="fill">
                      <mat-label>KIC KIUD</mat-label> 
                      <input matInput [value]="this.equipmentModalData.data.kiC_KUID" [disabled]="true">
                     
                    </mat-form-field>
                   </td>
                   <td *ngIf="KicUsersRoleId.kisceAdmin != this.userDetails.role_id">
                    <mat-form-field class="example-full-width w-100" appearance="fill">
                      <mat-label>DISTRICT</mat-label> 
                      <input matInput [value]="this.equipmentModalData.data.district" [disabled]="true">
                     
                    </mat-form-field>
                   </td>
                   <td *ngIf="KicUsersRoleId.kisceAdmin == this.userDetails.role_id">
                    <mat-form-field class="w-100"  appearance="fill" (click)="yearEstablish.open()" appYearFormat>
                      <mat-label>YEAR</mat-label>
                      <input matInput [matDatepicker]="yearEstablish" formControlName="year"  [min]="min_date" [max]="max_date">
                      <mat-datepicker-toggle matSuffix [for]="yearEstablish"></mat-datepicker-toggle>
                      <mat-datepicker  #yearEstablish startView="multi-year" (yearSelected)="handleYearSelected($event,yearEstablish,i)"></mat-datepicker>
                    </mat-form-field> 
                  </td>
                   <td *ngIf="KicUsersRoleId.kisceAdmin == this.userDetails.role_id">
                    <mat-form-field class="w-100" appearance="fill">
                      <mat-label>MONTH</mat-label>
                      <mat-select formControlName="month"> 
                        <mat-option *ngFor="let month of monthsDetails" [value]="month.id">{{month.name}}</mat-option>
                      </mat-select>
                    </mat-form-field> 
                  </td>
                 
                    <td>
                      <mat-form-field class="w-100" appearance="fill">
                        <mat-label>REGULAR TRAINING IS BEING PROVIDED?*</mat-label>
                        <mat-select formControlName="regular_training"  (selectionChange)="getRegularTraining($event, addMultiTagArray, i)">
                          <mat-option [value]="1">YES</mat-option>
                          <mat-option [value]="0">NO</mat-option>
                          
                        </mat-select>
                      </mat-form-field> 
                    </td>
               
                    
                    
                    <td>
                      <mat-form-field class="example-full-width w-100" appearance="fill">
                        <mat-label>IF NOT, REASONS THERE OF</mat-label> 
                        <input type="text" matInput  formControlName="reason">
                       
                      </mat-form-field>
                    </td>
                    <td>
                      <mat-form-field class="example-full-width w-100" appearance="fill">
                        <mat-label>TRAINING VIDEO LINK</mat-label> 
                        <input type="text" matInput  formControlName="training_Video_Link">
                       
                      </mat-form-field>
                    </td>
                    <!-- <td>
                      <div class="inputFileUpload-wraper border rounded-1 d-flex align-items-center">
                        <div class="inputfileLevel position-relative">
                          <span class="text-uppercase uploadLevel">UPLOAD DOCUMENT, IF ANY</span>
                       
                          <input type="file" class="inputUpload" #ADDAthleteMultiAddFileInput  (change)="uploadDocuments(ADDAthleteMultiAddFileInput.files,i)">
  
                        </div>
                        <div *ngIf="addMultiTagArray.controls[i].get('upload_file')?.value">
                          <a [href]="fileBaseUrl + addMultiTagArray.controls[i].get('upload_file')?.value" target="_blank">
                            <i class="fa-solid fa-eye"></i>
                          </a>
                        </div>
                      
                      </div>
                     
                    </td> -->
                   
                    <td>
                   
                      <a href="javascript:void(0)"  (click)="removeAddMultiTagArray(i)" *ngIf="this.addMultiTagArray.length>1"><i class="fa-solid fa-trash-can text-danger"></i></a>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div class="mt-3">
              <button type="button"  [disabled]="!this.multiTrainingDetailsForm.valid"   (click)="submitMultiTagged()" class="btn btn-lightblue me-2">{{equipmentModalData.action == 'add' ? 'SAVE' : 'UPDATE' }}</button>
             
              <button type="button"  (click)="activeModal.dismiss('Cross click')" class="btn readmore border px-3">CANCEL</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
