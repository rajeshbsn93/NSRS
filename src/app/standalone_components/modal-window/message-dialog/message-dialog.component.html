
<mat-dialog-content class="text-center">
  <div align="end">
    <div class="closeIcon"><mat-icon fontIcon="close"  [mat-dialog-close]="false"></mat-icon></div>
  </div>
  <div class="priority-icon">
    <mat-icon fontIcon="priority_high"></mat-icon>
  </div>
  <h5>{{data.engText}}</h5>
  <h6>{{data.hindiText}}</h6>
  <hr class="my-4 mt-md-5">
</mat-dialog-content>
<mat-dialog-actions align="center">
  <!-- <button mat-button mat-dialog-close>Cancel</button>
  <button mat-button [mat-dialog-close]="true" cdkFocusInitial>Install</button> -->
  <button type="button" class="btn btn-blue px-3 py-1" [mat-dialog-close]="true">OK</button>
  <!-- <button type="button" class="btn btn-danger"  [mat-dialog-close]="false">CANCEL</button> -->
</mat-dialog-actions>
