<div class="modal-body experience-modal">
    <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.close(false)"></button>
    <div class="titleTxt d-flex flex-wrap justify-content-between align-items-center">
      <h3 class="d-inline-flex align-items-center"><span class="titleIcon"><mat-icon class="material-symbols-outlined" fontIcon="camping"></mat-icon></span> Experience in national Camp</h3>
    </div>
      <div class="athlete">
        <div class="table-responsive mt-3">
            <table mat-table class="currentTable" matTableExporter  #exporter="matTableExporter" [dataSource]="experienceTableData" matSort class="table-striped w-100">  
                
                <ng-container matColumnDef="sl">
                <th mat-header-cell *matHeaderCellDef mat-sort-header="sl" class="col-xl-1"> S.NO </th>
                <td mat-cell *matCellDef="let row, let i=index">{{i + 1}}</td>
                </ng-container>  
                
                <ng-container matColumnDef="designation">
                <th mat-header-cell *matHeaderCellDef mat-sort-header="designation" class="text-nowrap"> Designation</th>
                <td mat-cell *matCellDef="let row"> 
                    {{row.designation}}                   

                </td>
                </ng-container>  
                
                <ng-container matColumnDef="Category">
                <th mat-header-cell *matHeaderCellDef mat-sort-header="category_of_player"> 
                    Category
                </th>
                <td mat-cell *matCellDef="let row"> 
                    {{row.category_of_player}}
                </td>
                </ng-container>
                <ng-container matColumnDef="from_Date">
                <th mat-header-cell *matHeaderCellDef mat-sort-header="camp_from"> 
                    Duration
                </th>
                <td mat-cell *matCellDef="let row"> 
                    {{row.camp_from | date:'dd-MM-yyyy'}} - {{row.camp_to | date: 'dd-MM-yyyy'}}
                </td>
                </ng-container>
                <ng-container matColumnDef="nsrs_id_academy">
                <th mat-header-cell *matHeaderCellDef mat-sort-header="uid_training_center"> 
                    Academy ID
                </th>
                <td mat-cell *matCellDef="let row"> 
                    {{row.uid_training_center}}
                </td>
                </ng-container>
                <ng-container matColumnDef="academy">
                <th mat-header-cell *matHeaderCellDef mat-sort-header="name_of_training_center"> 
                    Academy Name
                </th>
                <td mat-cell *matCellDef="let row"> 
                    {{row.name_of_training_center}}
                </td>
                </ng-container>
            
                <tr mat-header-row *matHeaderRowDef="experienceTableColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: experienceTableColumns;"></tr>      
            
                
                <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell text-center" colspan="13"> <span class="noDataFound"> No Data Found </span></td>
                </tr>
            </table>     
        </div>
        <mat-paginator [pageSizeOptions]="[5,10, 50, 100]" aria-label="Select page of users"></mat-paginator>
      </div>
    
  </div>

  <app-loader *ngIf="loader"></app-loader>
