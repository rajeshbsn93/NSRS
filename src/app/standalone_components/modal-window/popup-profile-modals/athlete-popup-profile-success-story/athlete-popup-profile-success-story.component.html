<div class="modal-body tagcommonModal profileModal">
    <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.close(false)"></button>
    <div class="titleTxt d-flex flex-wrap justify-content-between align-items-center">
      <h3><span class="titleIcon"><i class="icon-Check"></i></span> Success Story</h3>
      <!-- <button type="button" *ngIf="readonlyEdit" (click)="editButton()" class="btn btn-blue py-1 me-4">EDIT</button> -->
    </div>
    <!-- Nav tabs -->
<ul class="nav nav-tabs">
    <li class="nav-item">
      <a class="nav-link active" data-bs-toggle="tab" href="#success_story"> Success Story</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" data-bs-toggle="tab" href="#actionphoto">Action Photos</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" data-bs-toggle="tab" href="#actionvideo">Action Videos Links</a>
    </li>
  </ul>
  
  <!-- Tab panes -->
  <div class="tab-content mt-4"  *ngIf="popupDataReceived !=null else noData">
    <div class="tab-pane container active" id="success_story">
        <div class="col-sm-12 col-lg-12 col-xl-12 mb-3">
            <ng-container *ngIf="popupDataReceived.description_detail =='' ||popupDataReceived.description_detail==null; else storyElse">  
                <strong>NA</strong>              
            </ng-container>  
            <ng-template #storyElse>
                <angular-editor  [config]="editorConfig" [placeholder]="'success story here...'" [(ngModel)]="popupDataReceived.description_detail"></angular-editor>
            </ng-template>          
        </div>
    </div>
    <div class="tab-pane container fade" id="actionphoto">
        <div class="row row-info">
            <div class="col-sm-6 col-lg-4 col-xl-3 mb-3">
                <h6>Photo 1</h6>
                <a class="text-black" *ngIf="popupDataReceived?.photo_link1 !=(null || ''); else photo1" target="_blank" [href]="baseUrl + popupDataReceived?.photo_link1"><i class="fa-solid fa-eye"></i></a>
                <ng-template #photo1><strong>NA</strong></ng-template>
            </div>
            <div class="col-sm-6 col-lg-4 col-xl-3 mb-3">
                <h6>Photo 2</h6>
                <a class="text-black" *ngIf="popupDataReceived?.photo_link2 !=(null || ''); else photo2" target="_blank" [href]="baseUrl + popupDataReceived?.photo_link2"><i class="fa-solid fa-eye"></i></a>
                <ng-template #photo2><strong>NA</strong></ng-template>
            </div>
            <div class="col-sm-6 col-lg-4 col-xl-3 mb-3">
                <h6>Photo 3</h6>
                <a class="text-black" *ngIf="popupDataReceived?.photo_link3 !=(null || ''); else photo3" target="_blank" [href]="baseUrl + popupDataReceived?.photo_link3"><i class="fa-solid fa-eye"></i></a>
                <ng-template #photo3><strong>NA</strong></ng-template>
            </div>
            <div class="col-sm-6 col-lg-4 col-xl-3 mb-3">
                <h6>Photo 4</h6>
                <a class="text-black" *ngIf="popupDataReceived?.photo_link4 !=(null || ''); else photo4" target="_blank" [href]="baseUrl + popupDataReceived?.photo_link4"><i class="fa-solid fa-eye"></i></a>
                <ng-template #photo4><strong>NA</strong></ng-template>
            </div>
        </div>
    </div>
    <div class="tab-pane container fade" id="actionvideo">
        <div class="row row-info">
            <div class="col-sm-6 col-lg-4 col-xl-3 mb-3">
                <h6>Video 1</h6>
                <a class="text-black" *ngIf="popupDataReceived?.video_link1 !=(null || ''); else video1" target="_blank" [href]="popupDataReceived?.video_link1"><i class="fa-solid fa-eye"></i></a>
                <ng-template #video1><strong>NA</strong></ng-template>
            </div>
            <div class="col-sm-6 col-lg-4 col-xl-3 mb-3">
                <h6>Video 2</h6>
                <a class="text-black" *ngIf="popupDataReceived?.video_link2 !=(null || ''); else Video2" target="_blank" [href]="popupDataReceived?.video_link2"><i class="fa-solid fa-eye"></i></a>
                <ng-template #Video2><strong>NA</strong></ng-template>
            </div>
            <div class="col-sm-6 col-lg-4 col-xl-3 mb-3">
                <h6>Video 3</h6>
                <a class="text-black" *ngIf="popupDataReceived?.video_link3 !=(null || ''); else video3" target="_blank" [href]="popupDataReceived?.video_link3"><i class="fa-solid fa-eye"></i></a>
                <ng-template #video3><strong>NA</strong></ng-template>
            </div>
        </div>
    </div>
  </div>
    <ng-template #noData>
        <p class="text-center"><strong>Data not available!</strong></p>
      </ng-template>
  </div>
