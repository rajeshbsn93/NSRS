<div class="modal-body experience-modal my-max-h">
    <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.close(false)"></button>
    <div class="titleTxt d-flex flex-wrap justify-content-between align-items-center">
        <h3 class="d-inline-flex align-items-center"><span class="titleIcon"><mat-icon class="material-symbols-outlined"
                    fontIcon="camping"></mat-icon></span>{{editData == null ? 'Add' : 'Edit'}} PREVIOUS POSTING</h3>
    </div>
    <div>
        <form [formGroup]="previousPositionForm">
            <div>
                <div class="row">
                    <div class="custom-table table-responsive">
                        <table class="table table-bordered" style="white-space: nowrap">
                            <thead>
                                <tr>
                                    <th>S No.</th>
                                    <th>ACADEMY</th>
                                    <th>START DATE</th>
                                    <th>END DATE</th>
                                    <th>REMARKS</th>
                                    <th>ACTION</th>
                                </tr>
                            </thead>
                            <tbody formArrayName="officialTraining">
                                <tr *ngFor="let item of previousPositionFormArray.controls; let i= index"
                                    [formGroupName]="i">
                                    <td>{{i + 1}}</td>
                                    <td>
                                        <mat-form-field class="w-100" appearance="fill">
                                            <mat-label>Academy</mat-label>
                                            <mat-select formControlName="academy_detail_id"
                                                panelClass="academy-select-panel">

                                                <mat-option>
                                                    <input matInput placeholder="Search Academy"
                                                        [value]="academySearchTexts[i]"
                                                        (input)="onSearchChange($event, i)"
                                                        (click)="$event.stopPropagation()"
                                                        (keydown)="$event.stopPropagation()" class="w-100" />
                                                </mat-option>


                                                <mat-option
                                                    *ngFor="let academy of filteredAcademyListData[i]"
                                                    [value]="academy.academy_detail_id">
                                                    {{ academy.academy_name }}
                                                </mat-option>

                                            </mat-select>
                                        </mat-form-field>

                                    </td>
                                    <td>
                                        <mat-form-field class="w-100" appearance="fill" (click)="picker.open()">
                                            <mat-label>Start Date</mat-label>
                                            <input matInput formControlName="start_date" [max]="maxDate"
                                                [matDatepicker]="picker" (keyup)="picker.open()" (keypress)="false">
                                            <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                                            <mat-datepicker #picker></mat-datepicker>
                                        </mat-form-field>
                                    </td>

                                    <td>
                                        <mat-form-field class="w-100" appearance="fill" (click)="picker1.open()">
                                            <mat-label>End Date</mat-label>
                                            <input matInput formControlName="end_date"
                                                [min]="previousPositionFormArray.controls[i].value.start_date"
                                                [max]="maxDate" [matDatepicker]="picker1" (keyup)="picker.open()"
                                                (keypress)="false"
                                                [min]="previousPositionForm.get('start_date')?.value">
                                            <mat-datepicker-toggle matSuffix [for]="picker1"></mat-datepicker-toggle>
                                            <mat-datepicker #picker1></mat-datepicker>
                                        </mat-form-field>
                                    </td>
                                    <td>
                                        <mat-form-field class="w-100" appearance="fill">
                                            <mat-label>Remarks</mat-label>
                                            <input matInput formControlName="remarks">
                                        </mat-form-field>
                                        <mat-error
                                            *ngIf="previousPositionFormArray.controls[i].get('remarks')?.hasError('maxlength')">
                                            Maximum 250 characters allowed.
                                        </mat-error>

                                    </td>
                                    <td>
                                        <a href="javascript:void(0)" [hidden]="previousPositionFormArray.length === 1">
                                            <mat-icon class="text-danger" (click)="removeRow(i)">delete</mat-icon>
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                        <div class="row justify-content-end">
                            <div class="col-auto mt-2" *ngIf="!editData">
                                <button href="javascript:void(0)" (click)="addNewInputField()"
                                    class="btn btn-blue py-1 me-4">ADD+</button>
                            </div>
                        </div>
                    </div>
                    <div class="mt-3">
                        <button type="button" [disabled]="!this.previousPositionForm.valid"
                            class="btn readmore border my-blue-btn px-3 me-2" (click)="save()">SAVE</button>

                        <button type="button" (click)="activeModal.dismiss('Cross click')"
                            class="btn readmore border px-3">CANCEL</button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
<app-loader *ngIf="loader"></app-loader>
