  <tbody formArrayName="coachStrengthFormArray">
  <ng-container *ngFor="let coachStrengthItem of coachStrengthFormArray.controls; let i=index" [formGroupName]="i">
    <tr *ngFor="let type of sanctionTypes; let j = index">
      <td *ngIf="j === 0" [attr.rowspan]="sanctionTypes.length">{{ i + 1 }}</td>
      <td *ngIf="j === 0" [attr.rowspan]="sanctionTypes.length">
        {{ coachStrengthItem.get('discipline')?.value }}
      </td>
      <td>{{ coachStrengthItem.get(type + 'Type')?.value }}</td>
      <td>
        <input type="number" class="form-control text-center w-auto" [formControlName]="type + 'Men'">
      </td>
      <td>
        <input type="number" class="form-control text-center w-auto" [formControlName]="type + 'Women'">
      </td>
      <td>
        <a class="text-warning text-decoration-none" title="Save"
           (click)="editRowAthlete(coachStrengthItem.value, type.charAt(0).toUpperCase() + type.slice(1), i)"
           href="javascript:void(0)">
           <mat-icon class="material-symbols-outlined" fontIcon="save"></mat-icon>
        </a>
      </td>
    </tr>
  </ng-container>
