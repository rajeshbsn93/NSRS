<div class="athlete">
  <div class="table-responsive">
      <table mat-table class="currentTable" matTableExporter  #exporter="matTableExporter" [dataSource]="dataSource" matSort class="table-striped w-100">  
                              
        <ng-container matColumnDef="nsrs_Id">
          <th mat-header-cell *matHeaderCellDef mat-sort-header="nsrs_Id" class="col-2">NSRS ID</th>
          <td mat-cell *matCellDef="let row"> {{row.nsrs_Id}} </td>
          </ng-container>
          <ng-container matColumnDef="academy_Name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header="academy_Name" class="col-4"> Academy</th>
          <td mat-cell *matCellDef="let row"> {{row.academy_Name}} </td>
          </ng-container>         

          <tr mat-header-row *matHeaderRowDef="insuranceTableColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: insuranceTableColumns;"></tr> 
          <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell text-center" colspan="4"> <span class="noDataFound"> No Data Found </span></td>
          </tr>
      </table>
  </div>
  <mat-paginator [pageSizeOptions]="[5,10, 50, 100]" aria-label="Select page of users"></mat-paginator>
</div>
