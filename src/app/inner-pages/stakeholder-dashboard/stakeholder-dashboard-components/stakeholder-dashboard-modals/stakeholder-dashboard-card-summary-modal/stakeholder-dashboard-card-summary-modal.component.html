
<div class="modal-body tagcommonModal language-modal">
  <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.close(false)"></button>
  <div class="titleTxt d-flex flex-wrap justify-content-between align-items-center">
  <h3>
    <!-- <span class="titleIcon"><i class="icon-kicAttendanceHistory"></i></span> -->
     {{cardData.name}}
  </h3>
  </div>
  <hr />
  <div class="state-wise-tabs container-fluid">
    <!-- <div class="text-center"><img src="../assets/images/coming-soon.png" alt="" class="w-50"></div> -->
    <mat-tab-group  [selectedIndex]="activeIndexTab">
      <mat-tab label="ACADEMY" id="academy">
        <ng-container>
          <app-stakeholder-dashboard-card-summary-modal-academy *ngIf="!loader" [academyData]="academyTabData" ></app-stakeholder-dashboard-card-summary-modal-academy>
        </ng-container>
      </mat-tab>
  
      <mat-tab label="ATHLETE" id="athlete">
        <ng-container>
          <app-stakeholder-dashboard-card-summary-modal-athlete *ngIf="!loader" [tabType]="tabType" [athleteData]="athleteTabData"></app-stakeholder-dashboard-card-summary-modal-athlete>
        </ng-container>
      </mat-tab>
  
      <mat-tab label="COACH" id="coach">
        <ng-container>
          <app-stakeholder-dashboard-card-summary-modal-coach *ngIf="!loader" [tabType]="tabType" [coachData]="coachTabData"></app-stakeholder-dashboard-card-summary-modal-coach>
        </ng-container>
      </mat-tab>
  
      <mat-tab label="SPORTS SCIENTIST" id="sport_scientist" *ngIf="tabType !=='disciplineWise'">
        <ng-container>
         <app-stakeholder-dashboard-card-summary-modal-sport-scientist *ngIf="!loader" [sportScientistData]="sportScientistTabData"></app-stakeholder-dashboard-card-summary-modal-sport-scientist>
        </ng-container>
      </mat-tab>
    </mat-tab-group>
  </div>
</div>
<app-loader *ngIf="loader"></app-loader>
