<div class="modal-body tagcommonModal language-modal">
  <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.close(false)"></button>
  <div class="titleTxt d-flex flex-wrap justify-content-between align-items-center">
  <h3>
    <!-- <span class="titleIcon"><i class="icon-kicAttendanceHistory"></i></span> -->
    {{disciplineName}}
  </h3>
  </div>
  <hr />
  <div class="athlete">
      <div class="table-responsive">
          <table mat-table class="currentTable" matTableExporter  #exporter="matTableExporter" [dataSource]="dataSource" matSort class="table-striped w-100">  
                                  
              <ng-container matColumnDef="academy_name">
              <th mat-header-cell *matHeaderCellDef mat-sort-header="academy_name" class="col-3">Academy Name</th>
              <td mat-cell *matCellDef="let row"> {{row.academy_name}} </td>
              </ng-container>
              <ng-container matColumnDef="athletes">
              <th mat-header-cell *matHeaderCellDef mat-sort-header="athletes" class="col-3">Athlete</th>
              <td mat-cell *matCellDef="let row"> {{row.athletes}} </td>
              </ng-container>
              <ng-container matColumnDef="coaches">
              <th mat-header-cell *matHeaderCellDef mat-sort-header="coaches" class="col-3">Coach</th>
              <td mat-cell *matCellDef="let row"> {{row.coaches}} </td>
              </ng-container>
              <ng-container matColumnDef="sportsScientists">
              <th mat-header-cell *matHeaderCellDef mat-sort-header="sportsScientists" class="col-3">Sports Scientist</th>
              <td mat-cell *matCellDef="let row"> {{row.sportsScientists}} </td>
              </ng-container>               
              <ng-container *ngIf="chartClickType==1">
                <tr mat-header-row *matHeaderRowDef="overViewTableColumnsChart1"></tr>
                <tr mat-row *matRowDef="let row; columns: overViewTableColumnsChart1;"></tr>
              </ng-container>
              <ng-container *ngIf="chartClickType==2">
                <tr mat-header-row *matHeaderRowDef="overViewTableColumnsChart2"></tr>
                <tr mat-row *matRowDef="let row; columns: overViewTableColumnsChart2;"></tr>
              </ng-container>
              <ng-container *ngIf="chartClickType==3">
                <tr mat-header-row *matHeaderRowDef="overViewTableColumnsChart3"></tr>
                <tr mat-row *matRowDef="let row; columns: overViewTableColumnsChart3;"></tr>
              </ng-container>
              <tr class="mat-row" *matNoDataRow>
              <td class="mat-cell text-center" colspan="4"> <span class="noDataFound"> No Data Found </span></td>
              </tr>
          </table>
      </div>
      <mat-paginator [pageSizeOptions]="[5,10, 50, 100]" aria-label="Select page of users"></mat-paginator>
  </div>
</div>
