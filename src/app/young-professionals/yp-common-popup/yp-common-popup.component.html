<div class="row align-items-center justify-content-end">
  <div class="col-auto"><button type="button" class="btn-close " aria-label="Close" ></button></div>
</div>
<div *ngIf="data?.type=='rejectPopup'" class="container-fluid justify-content-center align-items-center modal-reject">

  <div class="row">
    <h3 class="text-center">Are you sure you want to reject Form 5 data of</h3>
    <h4 class="text-color text-center">{{data?.nsrsid}}</h4>
  </div>
     <!-- <p><strong>Are You Sure you want to Reject Form 5 Data of</strong></p> -->
     

     <div class="row justify-content-center mt-3 text-center ">
  <div class="col-md-auto col-12 my-1">    <button class="btn btn-primary btn-modal" (click)="reject(true)">Yes</button></div>
  <div class="col-md-auto col-12 my-1">   <button class="btn btn-danger btn-modal" (click)="reject(false)">No</button></div>
     </div>
</div>



<div *ngIf="data?.type=='showRejectedMsg'" class="container-fluid justify-content-center align-items-center modal-reject">
  <div class="row">
    <h3 class="text-center">{{data?.msg}}</h3>
  </div>
     
     <div class="row justify-content-center mt-3 text-center ">
  <div class="col-md-auto col-12 my-1"><button class="btn btn-primary btn-modal" (click)="close('rejected')">View Status</button></div>
     </div>
</div>

<app-loader *ngIf="isLoading"></app-loader>
