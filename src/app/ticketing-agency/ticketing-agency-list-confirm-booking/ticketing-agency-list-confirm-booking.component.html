<div class="row mt-2 justify-content-end align-items-center">
  <div class="col-auto">
    <div class="searchInput ms-2">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input class="form-control" placeholder="Proposal ID" />
    </div>
  </div>
</div>
<div class="mt-4">
  <form [formGroup]="pendingForm">
    <div class="table-responsive">
      <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8 table-striped w-100">
        <ng-container matColumnDef="sl_no">
          <th mat-header-cell *matHeaderCellDef>S.NO.</th>
          <td mat-cell *matCellDef="let element; let i=index">
            {{i+1}}
          </td>
        </ng-container>
  
        <ng-container matColumnDef="proposal_type">
          <th mat-header-cell *matHeaderCellDef>PROPOSAL TYPE</th>
          <td mat-cell *matCellDef="let element">ACTC</td>
        </ng-container>
  
        <ng-container matColumnDef="proposal_id">
          <th mat-header-cell *matHeaderCellDef class="text-nowrap">PROPOSAL ID</th>
          <td mat-cell *matCellDef="let element">{{element.get('proposal_Id').value}}</td>
        </ng-container>
  
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>NAME</th>
          <td mat-cell *matCellDef="let element">
            NEERAJ CHOPRA
          </td>
        </ng-container>
  
        <ng-container matColumnDef="mobile_no">
          <th mat-header-cell *matHeaderCellDef mat-sort-header="mobile_no" class="text-nowrap">MOBILE NO.</th>
          <td mat-cell *matCellDef="let element">
            9483988295
          </td>
        </ng-container>
  
        <ng-container matColumnDef="departure_date">
          <th mat-header-cell *matHeaderCellDef class="text-nowrap">DEPARTURE DATE</th>
          <td mat-cell *matCellDef="let element">
            10/04/2015
          </td>
        </ng-container>
  
        <ng-container matColumnDef="return_date">
          <th mat-header-cell *matHeaderCellDef  class="text-nowrap">RETURN DATE</th>
          <td mat-cell *matCellDef="let element">
            20/07/2015
          </td>
        </ng-container>
  
        <ng-container matColumnDef="origin">
          <th mat-header-cell *matHeaderCellDef>ORIGIN</th>
          <td mat-cell *matCellDef="let element">
            DELHI
          </td>
        </ng-container>
  
        <ng-container matColumnDef="destination">
          <th mat-header-cell *matHeaderCellDef>DESTINATION</th>
          <td mat-cell *matCellDef="let element">
            MUMBAI
          </td>
        </ng-container>
        <ng-container matColumnDef="bags">
          <th mat-header-cell *matHeaderCellDef class="text-nowrap">NO. OF BAGS</th>
          <td mat-cell *matCellDef="let element">
            2
          </td>
        </ng-container>
        <ng-container matColumnDef="insurance">
          <th mat-header-cell *matHeaderCellDef>INSURANCE REQUIRED</th>
          <td mat-cell *matCellDef="let element">
            <i class="icon-Check"></i>
          </td>
        </ng-container>
        <ng-container matColumnDef="passport">
          <th mat-header-cell *matHeaderCellDef>PASSPORT PDF</th>
          <td mat-cell *matCellDef="let element">
            <div  class="inputFileUpload-wraper border rounded-1 d-flex align-items-center">
              <div  class="inputfileLevel position-relative">
                <span  class="text-uppercase uploadLevel me-2">Document</span
                ><input
                  
                  type="file"
                  formcontrolname="document_upload_path"
                  accept=".png, .Jeg, .Jpg, .pdf"
                  class="inputUpload ng-untouched ng-pristine ng-valid"
                />
              </div>
             
              <!---->
            </div>
          </td>
        </ng-container>
        <ng-container matColumnDef="ticket_upload">
          <th mat-header-cell *matHeaderCellDef>TICKET UPLOAD</th>
          <td mat-cell *matCellDef="let element">
            <div  class="inputFileUpload-wraper border rounded-1 d-flex align-items-center">
              <div  class="inputfileLevel position-relative">
                <span  class="text-uppercase uploadLevel me-2">Upload</span
                ><input
                  
                  type="file"
                  formcontrolname="document_upload_path"
                  accept=".png, .Jeg, .Jpg, .pdf"
                  class="inputUpload ng-untouched ng-pristine ng-valid"
                />
              </div>
             
              <!---->
            </div>
          </td>
        </ng-container>
  
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell text-center" colspan="10"><span class="noDataFound"> No Data Found </span></td>
        </tr>
      </table>
    </div>
    <div class="mt-3 text-end">
      <!-- <button type="button" (click)="save()" class="btn btn-lightblue me-2 px-3 me-sm-3 me-lg-4 custom-btn-save">Save</button> -->
    </div>
  </form>
</div>
