<div class="modal-body tagcommonModal profileModal">
  <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss('Cross click')"></button>
  <div class="titleTxt d-flex flex-wrap justify-content-between align-items-center">
    <h3><span class="titleIcon"><i class="icon-football-line"></i></span> SPORTS DISCIPLINE</h3>
  </div>
  <!-- Nav tabs -->
  <ul class="nav nav-tabs mb-4">
    <li class="nav-item">
      <a class="nav-link active" data-bs-toggle="tab" href="#sport-discipline">SPORTS DISCIPLINE</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" (click)="athleteStrength()" data-bs-toggle="tab" href="#athlete-strength">ATHLETE STRENGTH</a>
    </li>
    <li class="nav-item">
      <a class="nav-link"  (click)="coachStrength()" data-bs-toggle="tab" href="#coach-strength">COACH STRENGTH</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" (click)="sportscientistStrength()" data-bs-toggle="tab" href="#sport-scientist-strength">SPORTS SCIENTIST STRENGTH</a>
    </li>
  </ul>

  <!-- Tab panes -->
  <div class="tab-content">
    <div class="tab-pane container active" id="sport-discipline">
        <div class="d-flex justify-content-end mb-3">
          <a href="javascript:void(0)" (click)="addEditSportsDiscipline(null)" class="btn btn-lightblue fw-normal px-3">Add +</a>
          <!-- <a href="javascript:void(0)" (click)="addEditSportsDiscipline(null)" class="btn btn-lightblue fw-normal px-3">ADD +</a> -->
        </div>
        <div class="athlete">
          <div class="table-responsive position-relative">
            <table mat-table id="sportDisciplineTable" [dataSource]="dataSource" matSort class="table-striped w-100">
        
              <ng-container matColumnDef="sn">
                <th mat-header-cell *matHeaderCellDef mat-sort-header="sln" class="col-1"> S.NO</th>
                <td mat-cell *matCellDef="let row"> {{row.sln}} </td>
              </ng-container>
              <ng-container matColumnDef="sport_name">
                <th mat-header-cell *matHeaderCellDef mat-sort-header="sport_name"> SPROTS DISCIPLINE </th>
                <td mat-cell *matCellDef="let row"> {{row.sport_name}} </td>
              </ng-container>
          
              <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
              <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
              
          
              <!-- Row shown when there is no matching data. -->
              <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell text-center" colspan="610"> <span class="noDataFound"> No Data Found </span></td>
              </tr>
            </table>   
            <mat-paginator [pageSizeOptions]="[10, 50, 100]" aria-label="Select page of users"></mat-paginator>
          </div>
          
        </div>  
    </div>
    <div class="tab-pane container fade" id="athlete-strength">
      <app-athlete-strength #athleteTabRef></app-athlete-strength>
    </div>
    <div class="tab-pane container fade" id="coach-strength">
      <app-coach-strength #coachStrengthTemp></app-coach-strength>
    </div>
    <div class="tab-pane container fade" id="sport-scientist-strength">
      <app-sport-scientist-strength #sportscientistRef></app-sport-scientist-strength>
    </div>
  </div>    
  
</div>


<app-loader *ngIf="mainLoader"></app-loader>
