<div class="modal-body experience-modal">
    <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.close(false)"></button>
    <div class="titleTxt d-flex flex-wrap justify-content-between align-items-center">
      <h3><span class="titleIcon"><i class="icon-achievement"></i></span>{{editData == null ? 'Add' : 'Edit'}} Award</h3>
      <!-- <button *ngIf="readonlyEdit" href="javascript:void(0)" (click)="editButton()" class="btn btn-blue py-1 me-4">EDIT</button> -->
    </div>
    <form [formGroup]="experienceForm">
      <div class="row">
        <div class="col mb-3">
          <mat-form-field class="w-100" appearance="fill">
            <mat-label>Received From</mat-label>
            <mat-select  formControlName="award_recieved_from" (valueChange)="changeReceivedForm($event)">
              <mat-option value="Central Govt">Central Govt</mat-option>
              <mat-option value="State Govt">State Govt</mat-option>
              <mat-option value="Other Agencies">Other Agencies</mat-option>
            </mat-select>
          </mat-form-field>
        </div>
        <div class="col mb-3">
            <mat-form-field class="w-100" appearance="fill" *ngIf="awardNameFieldChange">
                <mat-label>Name of Award</mat-label>
                <mat-select  formControlName="award_name" (selectionChange)="chamgeAwardName($event)">
                  <mat-option [value]="data.value" *ngFor="let data of awarList$ | async">{{data.text}}</mat-option>
                </mat-select>
            </mat-form-field>
            <mat-form-field class="w-100" appearance="fill" *ngIf="!awardNameFieldChange">
                <mat-label>Name of Award</mat-label>
                <input matInput formControlName="award_name">
            </mat-form-field>
        </div>
        <div class="col mb-3">
            <mat-form-field class="example-full-width w-100" appearance="fill" (click)="yearEstablish.open()" appYearFormat>
                <mat-label>Year</mat-label>
                <input matInput [matDatepicker]="yearEstablish" (keypress)="false" formControlName="award_year" [max]="maxDate" required>
                <mat-datepicker-toggle matSuffix [for]="yearEstablish"></mat-datepicker-toggle>
                <mat-datepicker #yearEstablish startView="multi-year" 
                  (yearSelected)="handleYearSelected($event,yearEstablish)">
                </mat-datepicker>
            </mat-form-field>
        </div>
        <div class="col-12 text-center">
            <hr class="mt-1">
            <button type="button" class="btn btn-blue px-4" [disabled]="!experienceForm.valid" (click)="save()">Save</button>
          </div>
      </div>
    </form>
    
  </div>

  <app-loader *ngIf="loader"></app-loader>
