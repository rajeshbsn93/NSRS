<div class="modal-body experience-modal">
    <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.close(false)"></button>
    <div class="titleTxt d-flex flex-wrap justify-content-between align-items-center">
      <h3><span class="titleIcon"><mat-icon class="material-symbols-outlined" fontIcon="home_repair_service"></mat-icon></span> TRAINING/WORKSHOP/CONFERENCE</h3>
      <!-- <button *ngIf="readonlyEdit" href="javascript:void(0)" (click)="editButton()" class="btn btn-blue py-1 me-4">EDIT</button> -->
    </div>
    <form [formGroup]="experienceForm">
      <div class="row">
        <div class="col-lg-3 col-sm-6 mb-3">
          <mat-form-field class="w-100" appearance="fill">
            <mat-label>Type</mat-label>
            <mat-select  formControlName="type">
              <mat-option value="Training">Training</mat-option>
              <mat-option value="Workshop">Workshop</mat-option>
              <mat-option value="Conference">Conference</mat-option>
            </mat-select>
          </mat-form-field>
        </div>
        <div class="col-lg-3 col-sm-6 mb-3">
            <mat-form-field class="w-100" appearance="fill">
                <mat-label>Level</mat-label>
                <mat-select  formControlName="level">
                  <mat-option value="International">International</mat-option>
                  <mat-option value="National">National</mat-option>
                </mat-select>
            </mat-form-field>
        </div>
        <div class="col-lg-3 col-sm-6 mb-3">
            <mat-form-field class="w-100" appearance="fill">
                <mat-label>Name</mat-label>
                <input matInput formControlName="name">
              </mat-form-field>
        </div>
        <div class="col-lg-3 col-sm-6 mb-3">
            <mat-form-field class="w-100" appearance="fill"  (click)="picker.open()">
                <mat-label>Date</mat-label>
                <input matInput formControlName="date" [matDatepicker]="picker" (keyup)="picker.open()" (keypress)="false">
                <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                <mat-datepicker #picker></mat-datepicker>
              </mat-form-field>
        </div>
        <div class="col-12 text-center">
            <hr class="mt-1">
            <button type="button" class="btn btn-blue px-4" [disabled]="!experienceForm.valid" (click)="save()">Save</button>
          </div>
      </div>
    </form>
    
  </div>

  <app-loader *ngIf="loader"></app-loader>
