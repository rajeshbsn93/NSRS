<div class="modal-body experience-modal">
    <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.close(false)"></button>
    <div class="titleTxt d-flex flex-wrap justify-content-between align-items-center">
      <h3 class="d-inline-flex align-items-center"><span class="titleIcon"><mat-icon class="material-symbols-outlined" fontIcon="home_repair_service"></mat-icon></span> Training/Workshop/Conference</h3>
      <button href="javascript:void(0)" (click)="addEdit(null)" class="btn btn-blue py-1 me-4">ADD</button>
    </div>
      <div class="athlete">
        <div class="table-responsive mt-3">
            <table mat-table class="currentTable" matTableExporter  #exporter="matTableExporter" [dataSource]="experienceTableData" matSort class="table-striped w-100">  
                
                <ng-container matColumnDef="sl">
                <th mat-header-cell *matHeaderCellDef mat-sort-header="sl" class="col-xl-1"> S.NO </th>
                <td mat-cell *matCellDef="let row, let i=index">{{i + 1}}</td>
                </ng-container>  
                
                <ng-container matColumnDef="type">
                <th mat-header-cell *matHeaderCellDef mat-sort-header="type" class="text-nowrap"> Type</th>
                <td mat-cell *matCellDef="let row"> 
                    {{row.type}}                   

                </td>
                </ng-container>  
                <ng-container matColumnDef="level">
                <th mat-header-cell *matHeaderCellDef mat-sort-header="level" class="text-nowrap"> Level</th>
                <td mat-cell *matCellDef="let row"> 
                    {{row.level}}                   

                </td>
                </ng-container>  
                
                <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef mat-sort-header="name"> 
                    Name
                </th>
                <td mat-cell *matCellDef="let row"> 
                    {{row.name}}
                </td>
                </ng-container>
        
                <ng-container matColumnDef="date">
                <th mat-header-cell *matHeaderCellDef mat-sort-header="date"> Date</th>
                <td mat-cell *matCellDef="let row">{{row.date | date: 'dd-MM-yyyy'}}
                </td>
                </ng-container>
                <ng-container matColumnDef="action">
                <th mat-header-cell *matHeaderCellDef class="col-1"> Action </th>
                <td mat-cell *matCellDef="let row"  class="action_col">
                    <!-- <div class="d-flex" [ngClass]="{'justify-content-around':row.mappedby_role_id===2}"> -->
                    <div class="d-flex">
                        <a href="javascript:void(0)" (click)="deleteRow(row)" class="text-danger"><i class="fa-solid fa-trash-can"></i></a>
                        <a href="javascript:void(0)" (click)="addEdit(row)"  class="text-success text-decoration-none ms-1"><i class="fas fa-edit"></i></a>
                    </div>
                </td>
                </ng-container>
            
                <tr mat-header-row *matHeaderRowDef="experienceTableColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: experienceTableColumns;"></tr>      
            
                
                <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell text-center" colspan="13"> <span class="noDataFound"> No Data Found </span></td>
                </tr>
            </table>     
        </div>
        <mat-paginator [pageSizeOptions]="[5,10, 50, 100]" aria-label="Select page of users"></mat-paginator>
      </div>
    
  </div>

  <ng-template #deleteExperience let-modal>
    <div class="modal-body tagcommonModal deleteCommonModal">
      <button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss('Cross click')"></button>
      <div class="titleTxt">
        <h4 class="text-center fw-bold"> {{deleteRowData.name}} <!--( {{ deleteRowData.year_of_experience }} {{ deleteRowData.year_of_experience > 0 ? ' Years ' : ' Year ' }} )--> </h4>
      </div>
      <div class="text-center mt-3 pt-lg-2">
        <p>Please confirm if you want delete this {{deleteRowData.type}}</p>
      </div>
      <div class="text-center pb-3">
        <button type="button" class="btn btn-lightblue me-2 px-3 me-sm-3 me-lg-4"
          (click)="modal.close('Save click')">CANCEL</button>
        <button type="button" class="btn btn-lightblue px-3" (click)="confirmDelete()">CONFIRM</button>
      </div>
    </div>
  </ng-template>

  <app-loader *ngIf="loader"></app-loader>
