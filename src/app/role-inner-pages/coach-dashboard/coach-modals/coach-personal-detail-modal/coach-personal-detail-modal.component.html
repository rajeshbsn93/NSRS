<div class="modal-body tagcommonModal profileModal">
    <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.close(false)"></button>
    <div class="titleTxt d-flex flex-wrap justify-content-between align-items-center">
      <h3><span class="titleIcon"><i class="icon-user-line"></i></span>PERSONAL INFORMATION</h3>
      <button 
        *ngIf="form.disabled" 
        href="javascript:void(0)" 
        (click)="enableForm()" 
        class="btn btn-blue py-1 me-4"
      >EDIT</button>
    </div>
    <form [formGroup]="form">
      <div class="row">
        <div class="col-6 mb-3">
          <mat-form-field class="w-100" appearance="fill">
            <mat-label>NAME</mat-label>
            <input matInput formControlName="name" />
          </mat-form-field>
        </div>
        <div class="col-6 mb-3">
          <mat-form-field class="w-100" appearance="fill">
            <mat-label>GENDER</mat-label>
            <mat-select formControlName="gender">
              <mat-option value="M">Male</mat-option>
              <mat-option value="F">Female</mat-option>
            </mat-select>
          </mat-form-field>
        </div>
        <div class="col-6 mb-3">
          <mat-form-field appearance="fill" class="w-100" (click)="dob.open()">
            <mat-label>DATE OF BIRTH</mat-label>
            <input matInput [matDatepicker]="dob" formControlName="dob" readonly [min]="minDate" [max]="maxDate" />
            <mat-datepicker-toggle matSuffix [for]="dob"></mat-datepicker-toggle>
            <mat-datepicker #dob></mat-datepicker>
          </mat-form-field>
        </div>
        <div class="col-6 mb-3">
          <mat-form-field appearance="fill" class="w-100">
            <mat-label>{{ isSportScientist ? 'CATEGORY' : 'SPORT DISCIPLINE' }}</mat-label>
            <input matInput formControlName="discipline" />
          </mat-form-field>
        </div>
      </div>
      <div class="row">
        <div class="col text-center">
          <hr class="mt-1" />
          <button type="button" class="btn btn-blue px-4" (click)="save()" [disabled]="form.disabled">Save</button>
        </div>
      </div>
    </form>
    
  </div>
  <app-loader *ngIf="loader"></app-loader>
