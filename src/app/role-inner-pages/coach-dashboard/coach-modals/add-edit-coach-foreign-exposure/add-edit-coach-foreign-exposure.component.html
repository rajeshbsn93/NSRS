<div class="modal-body experience-modal">
    <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.close(false)"></button>
    <div class="titleTxt d-flex flex-wrap justify-content-between align-items-center">
        <h3 class="d-inline-flex align-items-center"><span class="titleIcon"><mat-icon class="material-symbols-outlined" fontIcon="diversity_3"></mat-icon></span>{{editData==null?'Add':'Edit'}} Foreign exposure with national team</h3>
      <!-- <button *ngIf="readonlyEdit" href="javascript:void(0)" (click)="editButton()" class="btn btn-blue py-1 me-4">EDIT</button> -->
    </div>
    <form [formGroup]="experienceForm">
      <div class="row">
        <div class="col-lg-3 col-sm-6 mb-3">
          <mat-form-field class="w-100" appearance="fill" *ngIf="designation$ | async as designations; else designationsLoader">
            <mat-label>Designation</mat-label>
            <mat-select  formControlName="designation">
              <mat-option [value]="data.designation" *ngFor="let data of designations">{{data.designation}}</mat-option>
            </mat-select>
          </mat-form-field>
        </div>
        <div class="col-lg-3 col-sm-6 mb-3">
          <mat-form-field class="w-100" appearance="fill">
            <mat-label>Category</mat-label>
            <mat-select  formControlName="category_of_player">
              <mat-option value="Senior">Senior</mat-option>
              <mat-option value="Junior (Including Youth)">Junior (Including Youth)</mat-option>
              <mat-option value="Sub Junior (Including Cadet)">Sub Junior (Including Cadet)</mat-option>
            </mat-select>
          </mat-form-field>
        </div>
        <div class="col-lg-3 col-sm-6 mb-3">
            <mat-form-field class="w-100" appearance="fill">
                <mat-label>Exposure</mat-label>
                <input matInput formControlName="exposure">
              </mat-form-field>
        </div>        
        <div class="col-lg-3 col-sm-6 mb-3">
            <mat-form-field class="w-100" appearance="fill">
                <mat-label>Country</mat-label>
                <input type="text"
                placeholder="Select Country"
                matInput
                formControlName="country"
                [matAutocomplete]="countryAutoComplete">
                <mat-autocomplete autoActiveFirstOption #countryAutoComplete="matAutocomplete">
                    <mat-option *ngFor="let option of filteredCountryList$ | async" [value]="option.country_name">
                        {{option.country_name}}
                    </mat-option>
                </mat-autocomplete>
            </mat-form-field>
            <div *ngIf="experienceForm.get('country')?.touched || experienceForm.get('country')?.dirty && experienceForm.get('country')?.invalid" class="text-danger">
                <div *ngIf="experienceForm.get('country')!.hasError('countryError')">Invalid Country</div>
            </div>
        </div>
        <div class="col-lg-3 col-sm-6 mb-3">
            <mat-form-field class="w-100" appearance="fill"  (click)="picker.open()">
                <mat-label>From Date</mat-label>
                <input matInput formControlName="from_date" (dateChange)="changeCampDate($event)" [max]="maxDate" [matDatepicker]="picker" (keyup)="picker.open()" (keypress)="false">
                <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                <mat-datepicker #picker></mat-datepicker>
              </mat-form-field>
        </div>
        <div class="col-lg-3 col-sm-6 mb-3">
            <mat-form-field class="w-100" appearance="fill"  (click)="picker2.open()">
                <mat-label>To Date</mat-label>
                <input matInput formControlName="to_date" [matDatepicker]="picker2" (keyup)="picker2.open()" (keypress)="false"
                 [min]="experienceForm.get('from_date')?.value"  [max]="maxDate">
                <mat-datepicker-toggle matSuffix [for]="picker2"></mat-datepicker-toggle>
                <mat-datepicker #picker2></mat-datepicker>
              </mat-form-field>
        </div>                
        <div class="col-12 text-center">
            <hr class="mt-1">
            <button type="button" class="btn btn-blue px-4" [disabled]="!experienceForm.valid" (click)="save()">Save</button>
          </div>
      </div>
    </form>
    
  </div>

  <ng-template #designationsLoader>
    <app-loader></app-loader>
  </ng-template>
  <ng-template #countryLoader>
    <app-loader></app-loader>
  </ng-template>
  
  <app-loader *ngIf="loader"></app-loader>
