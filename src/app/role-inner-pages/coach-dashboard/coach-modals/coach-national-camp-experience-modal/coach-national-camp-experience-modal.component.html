<div class="modal-body tagcommonModal sports-ed-modal">
    <button type="button" class="close-btn" aria-label="Close" (click)="activeModal.close(false)"><mat-icon>close</mat-icon></button>
    <div class="titleTxt d-flex flex-wrap justify-content-between align-items-center">
      <h3><span class="titleIcon"><i class="icon-image-line"></i></span>EXPERIENCE IN NATIONAL CAMP</h3>
      <button type="button" class="btn btn-blue py-1">EDIT</button>
    </div>
    <form [formGroup]="form">
      <div class="row g-0 overflow-auto max-h-70-vh">
        <table class="table table-striped table-bordered">
          <thead>
            <tr>
              <th scope="col" class="text-center align-middle">DESIGNATION</th>
              <th scope="col" class="text-center align-middle">CATEGORY OF PLAYER</th>
              <th scope="col" class="text-center align-middle">PERIOD OF CAMP</th>
              <th scope="col" class="text-center align-middle">SPORTS TRAINING CENTER (KID)</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let record of [1,2]">
              <td class="text-center align-middle">{{ 'HEAD COACH' }}</td>
              <td class="text-center align-middle">{{ 'SENIOR' }}</td>
              <td class="text-center align-middle">{{ '01-01-2020 To 18-11-2020' }}</td>
              <td class="text-center align-middle">{{ 'Test NCOE (NCOEAA023AT)' }}</td>
            </tr>
          </tbody>
        </table>
      </div>
      
    </form>
    
  </div>
  <app-loader *ngIf="loader"></app-loader>
