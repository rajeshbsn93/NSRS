<div class="p-2 ps-3 d-flex align-items-center">
    <span class="page-heading-icon"><i class="icon-dashboard"></i></span>
    <span class="page-heading">DASHBOARD</span>
</div>

<div class="border-top">
    <div class="row mx-0">
        <div class="col-lg-9">
            <div class="px-2 py-3 py-lg-4">
                <!-- <h2 class="event-title d-inline-block">UPCOMING EVENTS</h2> -->
                <app-upcoming-event></app-upcoming-event>
            </div>
            <div><hr></div>
            <div class="px-2 py-3 py-lg-4">
                <div class="d-flex justify-content-between flex-wrap align-items-center">
                    <h2 class="event-title mb-sm-0">ACHIEVEMENT DETAIL</h2>
                    <a routerLink="/athlete-achievement" routerLinkActive="active" class="btn btn-blue px-3">VIEW DETAILS</a>
                </div>
                <!-- athleteAchievementDatas -->
                <div class="achievement-carousel mt-3 pe-2">
                    <owl-carousel-o [options]="customOptions">
                        <ng-container *ngFor="let carouselData of athleteDashboardData;let i =index">
                        <ng-template carouselSlide [id]="i.toString()">
                            <div  class="card" [ngClass]="carouselData?.position === '1' ? 'card-gold':carouselData?.position === '2'? 'card-silver':carouselData?.position === '3' ? 'card-bronze':'' ">
                                <div class="title-wrap d-flex justify-content-between">
                                    <h3>{{carouselData?.tournament_name}}</h3>
                                    <div class="icon-box"><i class="icon-medal-fill-4"></i></div>
                                </div>
                                <ul class="list-unstyled row" >
                                    <li class="col-6">
                                        <span class="iconlist"><i class="icon-square-grid"></i></span>
                                        <span class="cat-name">CATEGORY</span>
                                        <span class="cat-level">{{carouselData?.category}}</span>
                                    </li>
                                    <li class="col-6">
                                        <span class="iconlist"><i class="icon-Represented"></i></span>
                                        <span class="cat-name">REPRESENTED</span>
                                        <span class="cat-level">{{carouselData?.represented}}</span>
                                    </li>
                                    <li class="col-6">
                                        <span class="iconlist"><i class="icon-football-line"></i></span>
                                        <span class="cat-name">EVENT</span>
                                        <span class="cat-level"  placement="bottom" [ngbTooltip]="carouselData.event_list" container="body" tooltipClass="common-tooltip">{{carouselData?.event_list}}</span>
                                    </li>
                                    <li class="col-6">
                                        <span class="iconlist"><i class="icon-address-30"></i></span>
                                        <span class="cat-name">VENUE</span>
                                        <span class="cat-level" placement="bottom" [ngbTooltip]="carouselData.venue" container="body" tooltipClass="common-tooltip">{{carouselData?.venue}}</span>
                                    </li>
                                </ul>
                            </div>                            
                        </ng-template>
                        </ng-container>
                    </owl-carousel-o>
                </div>
            </div>
            <hr class="content-divider" />
        </div>
        <div class="col-lg-3 border-lg-start">
            <div class="py-lg-4">
                <app-athlete-dashboard-sidebar></app-athlete-dashboard-sidebar>
            </div>
        </div>
    </div>
</div>

<app-loader *ngIf="loader"></app-loader>
