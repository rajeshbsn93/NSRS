<div class="monitoring-and-evaluation py-4">
    <div class="container-fluid">


        <div class="row inner-tab-group mb-3">
            <div class="col-12 p-3 py-2">

                <mat-tab-group class="mt-2" [@.disabled]="true"  [(selectedIndex)]="selectedIndex">
                    <mat-tab aria-label="equipmentProcurement">
                        <ng-template matTabLabel class="tabEquipment">ACADEMY MASTER LIST</ng-template>

                        <div class="mt-4">
                            <ng-template matTabContent>
                                <app-kisce-academy-master-list
                                    (dataFromAcademyMaster)="academyMaster($event)" ></app-kisce-academy-master-list>

                            </ng-template>
                        </div>
                    </mat-tab>


                    <mat-tab aria-label="pastChampionAthlete">
                        <ng-template matTabLabel class="tabPastChampion">
                            <ng-container>PROPOSAL LIST </ng-container>

                        </ng-template>
                        <ng-template matTabContent>
                            <app-kisce-propsals></app-kisce-propsals>
                        </ng-template>
                    </mat-tab>

                   


                </mat-tab-group>
            </div>
        </div>
    </div>
</div>
<app-add-proposal-kisce *ngIf="popupShow"></app-add-proposal-kisce>
