<!-- Modal -->
<div class="modal fade show" id="addProposalModal" tabindex="-1" aria-labelledby="addProposalModalLabel"
  aria-hidden="true" style="display: block; background: rgba(128, 128, 128, 0.3);" aria-modal="true" role="dialog">
  <div class="modal-dialog modal-xl modal-dialog-centered">
    <div id="mContent" class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="addProposalModalLabel">KIC LIST DETAILS</h5>
        <button type="button" class="btn-close" aria-label="Close" (click)="modalClose('cancel')"></button>
      </div>
      <div class="modal-body">
        <div class="container-fluid my-modal-body">
          <!-- ++++++++++++ Proposal Form Start ++++++++++++++++ -->
        <div class="row ">
            <div class="equipementTable equipment-procurement-table">
                <div class="table-responsive position-relative">
                  <table mat-table id="scheduleMeetingTable"   [dataSource]="dataSource"  matSort class="table-striped  w-100">
                    <ng-container matColumnDef="index">
              
                      <ng-container matColumnDef="sno">
                        <th mat-header-cell *matHeaderCellDef > S.NO </th>
                        <td mat-cell *matCellDef="let element; let i=index">
                          {{this.paginator.pageIndex == 0 ? i + 1 : 1 + i + this.paginator.pageIndex * this.paginator.pageSize}}
                        </td>
                      </ng-container>
              
                      <ng-container matColumnDef="KID">
                        <th mat-header-cell *matHeaderCellDef >NSRS ID</th>
                        <td mat-cell *matCellDef="let element;">{{element.kitd_unique_id}}</td>
                      </ng-container>
              
                      <ng-container matColumnDef="name">
                        <th mat-header-cell *matHeaderCellDef >NAME</th>
                        <td mat-cell *matCellDef="let element;">{{element.academy_name}}</td>
                      </ng-container>
              
                      <ng-container matColumnDef="discipline">
                        <th mat-header-cell *matHeaderCellDef > STATE NAME</th>
                        <td mat-cell *matCellDef="let element">{{element.state_name}}</td>
                      </ng-container>
              
                     
              
                      <!-- <ng-container matColumnDef="action">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header="action"> Action </th>
                        <td mat-cell *matCellDef="let element">
                          <div class="d-flex align-items-center justify-content-center ">
                            <mat-icon  (click)="openAddModal('edit',element)" class="me-2 edit-btn-equipment">edit</mat-icon>
                          </div>
                        </td>
                      </ng-container> -->
              
                      <ng-container >
                        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
                      </ng-container>
              
              
                      <tr class="mat-row" *matNoDataRow>
                        <td class="mat-cell text-center" colspan="13"> <span class="noDataFound"> No Data Found </span></td>
                      </tr>
                    </ng-container>
                  </table>
                
                </div>
                <mat-paginator [pageSizeOptions]="[5,10, 25, 100]" aria-label="Select page">
                </mat-paginator>
              </div>
              
        </div>
        </div>
      </div>
    </div>
  </div>
</div>
