<!-- +++++++++++++++ DISTRIBUTION OF KIC & PCA ++++++++++++++++ -->
<div class="custom-card-overview-1 mt-4">
    <highcharts-chart *ngIf="!loader" id="container" [Highcharts]="highcharts" [options]="chartOptionsKicPca"
        style=" height: 500px; display: block">
    </highcharts-chart>

</div>


<!-- +++++++++++++++ DISTRIBUTION OF ATHLETE & COACHES ++++++++++++++++ -->
<div class="custom-card-overview-2 mt-4">
    <highcharts-chart *ngIf="!loader" id="container" [Highcharts]="highcharts" [options]="chartOptionsAthleteCoach"
        style=" height: 500px; display: block">
    </highcharts-chart>
</div>


<!-- +++++++++++++++ DISTRIBUTION OF ATHLETE & COACHES ++++++++++++++++ -->
<div class="custom-card-overview-3 mt-4">
    <highcharts-chart *ngIf="!loader" id="container" [Highcharts]="highcharts"
        [options]="chartOptionsRatioPcaKicAthleteCoach" style=" height: 500px; display: block">
    </highcharts-chart>
</div>


<div *ngIf="loader" class="loader d-flex align-items-center justify-content-center" style="height: 200px;">
    <app-page-loader [show]="loader"></app-page-loader>
</div>
