<!-- {{athleteData | json}} -->
<div class="athleteAction-modal">

  <div class="modal-body">
    <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss('Cross click')"></button>
    <nav>
      <div class="nav nav-tabs" id="nav-tab" role="tablist">
        <button class="nav-link active" data-bs-toggle="tab"
          data-bs-target="#eventList" type="button">Event DETAILS</button>
      </div>
    </nav>

    <div class="tab-content" id="nav-tabContent">
      <div class="tab-pane fade show active" id="eventList">  
        <div class="titleTxt my-3">
          <h4 class="text-center fw-bold text-uppercase ng-star-inserted">{{tournament_Category_Name}}</h4>
        </div>   
        <div class="table-responsive position-relative">
          <!-- <div class="example-loading-shade" *ngIf="isloading">
            <mat-spinner *ngIf="isloading"></mat-spinner>
          </div> -->
          <table mat-table id="academyDetailTable" matTableExporter [dataSource]="dataSource"
            class="mat-elevation-z8 w-100">
            <!-- nsrsid Column -->
            <ng-container matColumnDef="event_Name">
              <th mat-header-cell *matHeaderCellDef>Event Name </th>
              <td mat-cell *matCellDef="let element">{{element.event_Name}}</td>
            </ng-container>
      
            <!-- Name Column -->
            <!-- <ng-container matColumnDef="category">
              <th mat-header-cell *matHeaderCellDef> Category </th>
              <td mat-cell *matCellDef="let element"> {{element.category}}</td>
            </ng-container> -->
      
            <!-- Discipline Column -->
            <ng-container matColumnDef="gender_category">
              <th mat-header-cell *matHeaderCellDef> Gender </th>
              <td mat-cell *matCellDef="let element">{{element.gender_category}} </td>
            </ng-container>
      
            <!-- Gender Column -->
            <ng-container matColumnDef="event_Type">
              <th mat-header-cell *matHeaderCellDef> Type </th>
              <td mat-cell *matCellDef="let element"> {{element.event_Type}} </td>
            </ng-container>
            <!-- Mobile Column -->
            <ng-container matColumnDef="sport_Name">
              <th mat-header-cell *matHeaderCellDef> Discipline </th>
              <td mat-cell *matCellDef="let element"> {{element.sport_Name}} </td>
            </ng-container>
            <!-- Email Column -->
            <!-- <ng-container matColumnDef="age_Group">
              <th mat-header-cell *matHeaderCellDef> Age Group </th>
              <td mat-cell *matCellDef="let element"> {{element.age_Group}}</td>
            </ng-container> -->
      
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            <tr class="mat-row" *matNoDataRow>
              <td class="mat-cell text-center" colspan="6"> <span class="noDataFound"> No data found</span></td>
            </tr>
          </table>          
        </div>
        <div>
          <mat-paginator [pageSizeOptions]="[10, 20,50,100,200]" showFirstLastButtons
            aria-label="Select page of periodic elements">
          </mat-paginator>
        </div>
      </div>
    </div>
  </div>
</div>

<app-loader *ngIf="innerLoaderMainData"></app-loader>
